<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
    <title>FastOrder ChartViewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="workspace">
        <aside class="toolbar" aria-label="ابزارهای تحلیل موقعیت">
            <button id="long-tool" class="tool-button" type="button" aria-pressed="false" title="موقعیت خرید (L)">
                <span aria-hidden="true">↗</span>
                <span>Long</span>
            </button>
            <button id="short-tool" class="tool-button" type="button" aria-pressed="false" title="موقعیت فروش (S)">
                <span aria-hidden="true">↘</span>
                <span>Short</span>
            </button>
            <button id="delete-tool" class="tool-button danger" type="button" disabled title="حذف موقعیت انتخاب‌شده (Delete)">
                <span aria-hidden="true">×</span>
                <span>Delete</span>
            </button>
        </aside>

        <section class="chart-panel" aria-label="نمودار کندل محلی">
            <header class="chart-header">
                <div>
                    <strong id="symbol-name">POC</strong>
                    <span class="analysis-only">Analysis only · local mock data</span>
                </div>
                <output id="interaction-status" aria-live="polite">یک ابزار را انتخاب کنید.</output>
            </header>
            <div id="chart-host">
                <canvas id="drawing-overlay" aria-hidden="true"></canvas>
            </div>
            <footer class="chart-footer">
                <span>Wheel: zoom · Drag empty chart: pan · Delete: remove selected</span>
                <a href="https://www.tradingview.com/" target="_blank" rel="noreferrer">Charts by TradingView</a>
            </footer>
        </section>
    </main>

    <script src="vendor/lightweight-charts.standalone.production.js"></script>
    <script src="app.js"></script>
</body>
</html>
